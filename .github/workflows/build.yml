name: Build DLLs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Pinned CommonLibSSE-NG (supports Skyrim SE + AE incl. 1.6.1170 through the Address Library).
      - name: Fetch CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone https://github.com/CharmedBaryon/CommonLibSSE-NG.git extern/CommonLibSSE-NG
          git -C extern/CommonLibSSE-NG checkout b93280e

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DBUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SKSE/Plugins | Out-Null
          Get-ChildItem -Recurse build -Filter Bono*.dll | Where-Object { $_.FullName -match 'Release' } | ForEach-Object { Copy-Item $_.FullName dist/SKSE/Plugins/ }
          Get-ChildItem dist/SKSE/Plugins

      - uses: actions/upload-artifact@v4
        with:
          name: BonoDMC-AE-DLLs
          path: dist/
